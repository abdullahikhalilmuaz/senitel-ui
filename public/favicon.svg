<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e" />
      <stop offset="100%" stop-color="#0f0f1a" />
    </linearGradient>
    
    <!-- Liquid Purple Gradient for the S -->
    <linearGradient id="sGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <!-- Glass Edge Highlight -->
    <linearGradient id="glassEdge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.4)" />
      <stop offset="50%" stop-color="rgba(255,255,255,0.05)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.1)" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Squircle (Glass Background) -->
  <rect x="5" y="5" width="90" height="90" rx="28" fill="url(#bgGrad)" />
  
  <!-- Glass Border Effect -->
  <rect x="5" y="5" width="90" height="90" rx="28" fill="none" stroke="url(#glassEdge)" stroke-width="2" />

  <!-- The Letter "S" (Liquid Style) -->
  <text x="50" y="53" font-family="Arial, sans-serif" font-weight="900" font-size="56" fill="url(#sGrad)" text-anchor="middle" dominant-baseline="middle" filter="url(#glow)">S</text>
</svg>